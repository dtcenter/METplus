{% set version = "6.0.0" %}
{% set met_version = "12.0.1" %}
{% set ecbuild_version = "3.9.0" %}
{% set eckit_version = "1.28.4" %}
{% set atlas_version = "0.37.0" %}

package:
  name: metplus
  version: {{ version }}

source:
  # METplus Wrappers
  - url: https://github.com/dtcenter/METplus/archive/refs/tags/v{{ version }}.tar.gz
    md5: a5612dfd025055707f4a45dff028e628
    sha256: e9358aede2fd2abecd81806227de7b165d68fdf2fc9defcbba24df229461b155

  # MET
  - url: https://github.com/dtcenter/MET/archive/refs/tags/v{{ met_version }}.tar.gz
    md5: 36c2fe59bb2a61728d9c57a8ded3e80c
    sha256: ef396a99ca6c2248855848cd194f9ceaf3b051fb5e8c01a0b0b2a00110b1fcfb
    folder: MET

  # GS Fonts
  - url: https://downloads.sourceforge.net/project/gs-fonts/gs-fonts/8.11%20%28base%2035%2C%20GPL%29/ghostscript-fonts-std-8.11.tar.gz
    md5: 6865682b095f8c4500c54b285ff05ef6
    sha256: 0eb6f356119f2e49b2563210852e17f57f9dcc5755f350a69a46a0d641a0c401
    folder: gs-fonts

  # ecbuild 3.9.0
  - url: https://github.com/ecmwf/ecbuild/archive/refs/tags/{{ ecbuild_version }}.tar.gz
    md5: d2117212580160c24f62649643fa92e5
    sha256: 8ad20169a7d917d6ac81a7ca0d1b11616e2aeb82c7782f6ae5b768603a3e000a
    folder: ecbuild

  # eckit 1.28.4
  - url: https://github.com/ecmwf/eckit/archive/refs/tags/{{ eckit_version }}.tar.gz
    md5: 2f5299480ad43b53fa0df8482683968f
    sha256: c6215efc5b6f190e9dd239e7784986f9d72381e70cb83b1067538240cc9b5c41
    folder: eckit

  # atlas 0.37.0
  - url: https://github.com/ecmwf/atlas/archive/refs/tags/{{ atlas_version }}.tar.gz
    md5: 3d27a1b3273e06a21bbab1982278ad58
    sha256: 26edab963e7f17bf4759924af4d3fb45582a64d1afd003d50a93ea7cf6f052a5
    folder: atlas

channels:
  - conda-forge

build:
  skip: true # [win]
  missing_dso_whitelist:
    {% if osx %}
    - libeckit.dylib
    - libeckit_geometry.dylib
    - libatlas.dylib
    - libncurses.6.dylib
    {% else %}
    - libeckit.so
    - libeckit_geometry.so
    - libatlas.so
    {% endif %}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - {{ compiler('cxx') }}
    - gcc_linux-64=12  # GCC 12 on Linux (needed for Atlas)  [linux]
    - libcxx
    - cairo
    - freetype
    - gsl
    - libnetcdf
    - netcdf-cxx4=4.3.1
    - libopenblas
    - python
    - zlib
    - nceplibs-bufr
    - python-configuration
    - jasper
    - nceplibs-g2c
    - hdf4
    - hdfeos2
    - proj
    - fftw              # needed for atlas
    - _openmp_mutex=4.5 # [linux]
    - llvm-openmp       # [osx]

  host:
    - python 3.10
    - gsl
    - netcdf-cxx4
    - zlib
    - cairo
    - freetype
    - nceplibs-bufr
    - nceplibs-g2c
    - xarray
    - numpy
    - pandas
    - pyyaml
    - scipy
    - fftw
    - ncurses
    - hdfeos2
    - _openmp_mutex # [linux]
    - llvm-openmp   # [osx]
    - libcxx
    - setuptools
    - setuptools-git-versioning >=2.0,<3

  run:
    - gsl
    - netcdf-cxx4
    - libopenblas
    - python
    - nceplibs-bufr
    - nceplibs-g2c
    - hdf4
    - ncurses
    - bzip2
    - lz4-c
    - snappy
    - libaec
    - libcurl
    - fftw
    - xarray
    - numpy
    - pandas
    - pyyaml
    - netcdf4
    - scipy
    - _openmp_mutex # [linux]
    - llvm-openmp   # [osx]


about:
  home: https://dtcenter.org/community-code/metplus
  licence: http://www.apache.org/licenses/LICENSE-2.0

extra:
  maintainers:
    - georgemccabe
