{% set version = "6.0.0" %}
{% set met_version = "12.0.2" %}

package:
  name: metplus
  version: {{ version }}

source:
  # METplus Wrappers
  - url: https://github.com/dtcenter/METplus/archive/refs/tags/v{{ version }}.tar.gz
    md5: a5612dfd025055707f4a45dff028e628
    sha256: e9358aede2fd2abecd81806227de7b165d68fdf2fc9defcbba24df229461b155

  # MET
  - url: https://github.com/dtcenter/MET/archive/refs/tags/v{{ met_version }}.tar.gz
    md5: 4b9dba80639a74f1a3ecb15357785603
    sha256: 613c74cbe5a0afa87422e81a4cd70984238c1a0eaf1a395503486331223ede45
    folder: MET

  # GS Fonts
  - url: https://downloads.sourceforge.net/project/gs-fonts/gs-fonts/8.11%20%28base%2035%2C%20GPL%29/ghostscript-fonts-std-8.11.tar.gz
    md5: 6865682b095f8c4500c54b285ff05ef6
    sha256: 0eb6f356119f2e49b2563210852e17f57f9dcc5755f350a69a46a0d641a0c401
    folder: gs-fonts


build:
  skip: True  # [win]
  number: 0
  entry_points:
    - run_metplus.py = metplus.scripts.run_metplus:cli_main


requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('fortran') }}
    - {{ compiler('cxx') }}
    - cmake
    - make
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - python 3.10
    - python-configuration

  host:
    - python 3.10
    - pip
    - gsl
    - netcdf-cxx4
    - zlib
    - cairo
    - freetype
    - nceplibs-bufr
    - nceplibs-g2c
    - jasper
    - proj
    - metview
    - hdfeos2
    - libcxx
    - setuptools
    - setuptools-git-versioning >=2.0,<3

  run:
    - gsl
    - netcdf-cxx4
    - libopenblas
    - python 3.10
    - nceplibs-bufr
    - nceplibs-g2c
    - hdf4
    - metview
    - xarray
    - numpy >=1.24,<2
    - pandas
    - pyyaml
    - netcdf4
    - scipy

test:
  commands:
    - $PREFIX/bin/ascii2nc
    - "$PREFIX/bin/ensemble_stat || [ $? == 1 ]"
    - "$PREFIX/bin/gen_ens_prod || [ $? == 1 ]"
    - "$PREFIX/bin/gen_vx_mask || [ $? == 1 ]"
    - "$PREFIX/bin/grid_diag || [ $? == 1 ]"
    - "$PREFIX/bin/grid_stat || [ $? == 1 ]"
    - "$PREFIX/bin/ioda2nc || [ $? == 1 ]"
    - "$PREFIX/bin/lidar2nc || [ $? == 1 ]"
    - "$PREFIX/bin/madis2nc || [ $? == 1 ]"
    - "$PREFIX/bin/mode || [ $? == 1 ]"
    - "$PREFIX/bin/mode_analysis || [ $? == 1 ]"
    - "$PREFIX/bin/mtd || [ $? == 1 ]"
    - "$PREFIX/bin/pb2nc || [ $? == 1 ]"
    - "$PREFIX/bin/pcp_combine || [ $? == 1 ]"
    - "$PREFIX/bin/plot_data_plane || [ $? == 1 ]"
    - "$PREFIX/bin/plot_point_obs || [ $? == 1 ]"
    - "$PREFIX/bin/point2grid || [ $? == 1 ]"
    - "$PREFIX/bin/point_stat || [ $? == 1 ]"
    - "$PREFIX/bin/regrid_data_plane || [ $? == 1 ]"
    - "$PREFIX/bin/series_analysis || [ $? == 1 ]"
    - "$PREFIX/bin/stat_analysis || [ $? == 1 ]"
    - "$PREFIX/bin/tc_diag || [ $? == 1 ]"
    - "$PREFIX/bin/tc_gen || [ $? == 1 ]"
    - "$PREFIX/bin/tc_pairs || [ $? == 1 ]"
    - "$PREFIX/bin/tc_rmw || [ $? == 1 ]"
    - "$PREFIX/bin/tc_stat || [ $? == 1 ]"
    - "$PREFIX/bin/wavelet_stat || [ $? == 1 ]"
  imports:
    - metplus


about:
  home: https://dtcenter.org/community-code/metplus
  summary: 'Unified NWP model verification, validation, and diagnostic tools'
  license: Apache-2.0
  license_family: APACHE
  license_file:
    - LICENSE.md
  doc_url: https://metplus.readthedocs.io
  dev_url: https://github.com/dtcenter/METplus

extra:
  recipe-maintainers:
    - georgemccabe
