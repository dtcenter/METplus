[config]

# Documentation for this use case can be found at
# https://metplus.readthedocs.io/en/latest/generated/met_tool_wrapper/GridDiag/GridDiag.html

# For additional information, please see the METplus Users Guide.
# https://metplus.readthedocs.io/en/latest/Users_Guide

###
# Processes to run
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#process-list
###

#PROCESS_LIST = GridDiag, UserScript
PROCESS_LIST = UserScript
SCRUB_STAGING_DIR = False


###
# Time Info
# LOOP_BY options are INIT, VALID, RETRO, and REALTIME
# If set to INIT or RETRO:
#   INIT_TIME_FMT, INIT_BEG, INIT_END, and INIT_INCREMENT must also be set
# If set to VALID or REALTIME:
#   VALID_TIME_FMT, VALID_BEG, VALID_END, and VALID_INCREMENT must also be set
# LEAD_SEQ is the list of forecast leads to process
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#timing-control
###

GRID_DIAG_RUNTIME_FREQ = RUN_ONCE_FOR_EACH

LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG = 2023091500
INIT_END = 2023091500
INIT_INCREMENT = 86400

LEAD_SEQ = 1, 3, 6, 12, 24


###
# File I/O
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

GRID_DIAG_INPUT_DIR = {INPUT_BASE}/model_applications/short_range/GridDiag_fcstFV3_fcstOnly_EnergySpectra
GRID_DIAG_INPUT_TEMPLATE = FV3_ctrl/{init?fmt=%Y%m%d%H}/dynf{lead?fmt=%HHH}.nc,FV3_sppt/{init?fmt=%Y%m%d%H}/dynf{lead?fmt=%HHH}.nc

GRID_DIAG_PAIRED = True

GRID_DIAG_OUTPUT_DIR = {OUTPUT_BASE}/GridDiag_fcstFV3_fcstOnly_EnergySpectra/GridDiag
GRID_DIAG_OUTPUT_TEMPLATE = energy_spectra_FV3_{init?fmt=%Y%m%d%H}_f{lead?fmt=%HHH}.nc


###
# Field Info
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#field-info
###

FCST_GRID_DIAG_VAR1_NAME = KENG
FCST_GRID_DIAG_VAR1_LEVELS = "(0,39,*,*)"
FCST_GRID_DIAG_VAR1_OPTIONS = n_bins = 300; range = [0, 300]; set_attr_name = "KENG_CTRL"; set_attr_level = "P500"; set_attr_init = "{init?fmt=%Y%m%d_%H%M%S}"; set_attr_lead = "{lead?fmt=%HH}0000";

FCST_GRID_DIAG_VAR2_NAME = KENG
FCST_GRID_DIAG_VAR2_LEVELS = "(0,39,*,*)"
FCST_GRID_DIAG_VAR2_OPTIONS = n_bins = 300; range = [0, 300]; set_attr_name = "KENG_EXPT"; set_attr_level = "P500"; set_attr_init = "{init?fmt=%Y%m%d_%H%M%S}"; set_attr_lead = "{lead?fmt=%HH}0000";

GRID_DIAG_FILE_TYPE = NETCDF_NCCF


###
# GridDiag Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#griddiag
###

GRID_DIAG_MET_CONFIG_OVERRIDES = set_attr_grid="lambert 1799 1059 21.138123 237.280472 262.5 3 6371.2 38.5 N"; u_wind_field_name="ugrd"; v_wind_field_name="vgrd";

GRID_DIAG_DESC = FV3

GRID_DIAG_CONFIG_FILE = {PARM_BASE}/met_config/GridDiagConfig_wrapped

GRID_DIAG_POWER_SPECTRUM_MISSING_FLAG = NONE
GRID_DIAG_POWER_SPECTRUM_MISSING_VALUE = 0.0
GRID_DIAG_POWER_SPECTRUM_VLD_THRESH = 0.5

GRID_DIAG_OUTPUT_FLAG_POWER_SPECTRUM = TRUE


###
# UserScript File I/O
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

USER_SCRIPT_INPUT_DIR = {GRID_DIAG_OUTPUT_DIR}
USER_SCRIPT_INPUT_TEMPLATE = {GRID_DIAG_OUTPUT_TEMPLATE}

USER_SCRIPT_INPUT_TEMPLATE_LABELS = POWER_SPECTRA_INPUT


###
# UserScript Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#userscript
###

USER_SCRIPT_RUNTIME_FREQ = RUN_ONCE

USER_SCRIPT_COMMAND = {METPLUS_BASE}/parm/use_cases/model_applications/short_range/GridDiag_fcstFV3_fcstOnly_EnergySpectra/plot_energy_spectra.py


[user_env_vars]
PLOT_SPECTRA_YAML_CONFIG_NAME = {METPLUS_BASE}/parm/use_cases/model_applications/short_range/GridDiag_fcstFV3_fcstOnly_EnergySpectra/plot_energy_spectra.yaml

PLOT_OUTPUT_DIR = {OUTPUT_BASE}

PYTHONPATH = {METPLUS_BASE}/../METcalcpy:{METPLUS_BASE}/../METcalcpy/metcalcpy
