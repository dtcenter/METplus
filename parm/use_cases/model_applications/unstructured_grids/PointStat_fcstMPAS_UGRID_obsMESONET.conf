[config]

PROCESS_LIST=PointStat

LOOP_BY=INIT
INIT_TIME_FMT=%Y%m%d%H
INIT_BEG=2025051900
INIT_END=2025051900
INIT_INCREMENT=24H
LEAD_SEQ=begin_end_incr(0,6,1)

MODEL=OK_12km_ugrid
MESONET_OBS_VARNAME=TAIR

FCST_VAR1_NAME=t2m
FCST_VAR1_LEVELS=Z2
FCST_VAR1_OPTIONS = convert(x) = K_to_C(x);

OBS_VAR1_NAME={MESONET_OBS_VARNAME}
OBS_VAR1_LEVELS=Z0

FCST_POINT_STAT_INPUT_DIR={INPUT_BASE}/model_applications/unstructured_grids/PointStat_fcstMPAS_UGRID_obsMESONET
FCST_POINT_STAT_INPUT_TEMPLATE=diag.{valid?fmt=%Y}-{valid?fmt=%m}-{valid?fmt=%d}_{valid?fmt=%H}.00.00.nc
OBS_POINT_STAT_INPUT_DIR=
OBS_POINT_STAT_INPUT_TEMPLATE=PYTHON_NUMPY={PARM_BASE}/use_cases/model_applications/unstructured_grids/PointStat_fcstMPAS_UGRID_obsMESONET/read_OK_mesonet.py {valid?fmt=%Y%m%d}_{valid?fmt=%H}00 {INPUT_BASE}/model_applications/unstructured_grids/PointStat_fcstMPAS_UGRID_obsMESONET {MESONET_OBS_VARNAME}


POINT_STAT_UGRID_DATASET=mpas
POINT_STAT_UGRID_COORDINATES_FILE={INPUT_BASE}/model_applications/unstructured_grids/PointStat_fcstMPAS_UGRID_obsMESONET/init.nc
POINT_STAT_UGRID_MAX_DISTANCE_KM=

POINT_STAT_MESSAGE_TYPE=MSONET
POINT_STAT_OBS_WINDOW_BEG=-900
POINT_STAT_OBS_WINDOW_END=900
LOG_POINT_STAT_VERBOSITY=4

POINT_STAT_OUTPUT_DIR={OUTPUT_BASE}/{MODEL}/point_stat
POINT_STAT_OUTPUT_FLAG_CTC=STAT
POINT_STAT_OUTPUT_FLAG_CNT=STAT
POINT_STAT_OUTPUT_FLAG_MPR=BOTH

