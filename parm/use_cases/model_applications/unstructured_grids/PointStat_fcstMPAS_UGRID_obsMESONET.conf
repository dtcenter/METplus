[config]

PROCESS_LIST=PointStat

LOOP_BY=INIT
INIT_TIME_FMT=%Y%m%d%H
INIT_BEG=2025051900
INIT_END=2025051900
INIT_INCREMENT=24H
#LEAD_SEQ=begin_end_incr(0,36,1)
LEAD_SEQ=24

MODEL=OK_1km_ugrid
MESONET_OBS_VARNAME=TAIR

FCST_VAR1_NAME=t2m
FCST_VAR1_LEVELS=Z2
#FCST_VAR1_OPTIONS = convert(x) = K_to_C(x); set_attr_lead = "{lead?fmt=%H}";
FCST_VAR1_OPTIONS = convert(x) = K_to_C(x);

OBS_VAR1_NAME={MESONET_OBS_VARNAME}
OBS_VAR1_LEVELS=Z0

FCST_POINT_STAT_INPUT_DIR={INPUT_BASE}/fcst/mpas/ugrid/{MODEL}/{init?fmt=%Y%m%d%H}/ens_1
FCST_POINT_STAT_INPUT_TEMPLATE=diag.{valid?fmt=%Y}-{valid?fmt=%m}-{valid?fmt=%d}_{valid?fmt=%H}.00.00.nc
OBS_POINT_STAT_INPUT_DIR=
OBS_POINT_STAT_INPUT_TEMPLATE=PYTHON_NUMPY={INPUT_BASE}/scripts/obs/read_OK_mesonet.py {valid?fmt=%Y%m%d}_{valid?fmt=%H}00 {INPUT_BASE} {MESONET_OBS_VARNAME}

POINT_STAT_UGRID_DATASET=mpas
POINT_STAT_UGRID_COORDINATES_FILE={INPUT_BASE}/fcst/mpas/ugrid/{MODEL}/init.nc
POINT_STAT_UGRID_MAX_DISTANCE_KM=

POINT_STAT_MESSAGE_TYPE=MSONET
POINT_STAT_OBS_WINDOW_BEG=-900
POINT_STAT_OBS_WINDOW_END=900
POINT_STAT_MASK_POLY={INPUT_BASE}/masks/regrid_ok_1km_mask.nc
LOG_POINT_STAT_VERBOSITY=4

POINT_STAT_OUTPUT_DIR={OUTPUT_BASE}/{MODEL}/point_stat
POINT_STAT_OUTPUT_FLAG_CTC=STAT
POINT_STAT_OUTPUT_FLAG_CNT=STAT
POINT_STAT_OUTPUT_FLAG_MPR=BOTH

