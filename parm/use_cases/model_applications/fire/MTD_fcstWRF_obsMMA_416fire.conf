[config]

# Documentation for this use case can be found at
# https://metplus.readthedocs.io/en/latest/generated/met_tool_wrapper/MTD/MTD.html

# For additional information, please see the METplus Users Guide.
# https://metplus.readthedocs.io/en/latest/Users_Guide

###
# Processes to run
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#process-list
###

PROCESS_LIST = MTD


###
# Time Info
# LOOP_BY options are INIT, VALID, RETRO, and REALTIME
# If set to INIT or RETRO:
#   INIT_TIME_FMT, INIT_BEG, INIT_END, and INIT_INCREMENT must also be set
# If set to VALID or REALTIME:
#   VALID_TIME_FMT, VALID_BEG, VALID_END, and VALID_INCREMENT must also be set
# LEAD_SEQ is the list of forecast leads to process
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#timing-control
###

LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H%M
INIT_BEG=201806011600
INIT_END=201806011600
INIT_INCREMENT=3600

LEAD_SEQ = begin_end_incr(1,35,1)

SCRUB_STAGING_DIR = False

###
# File I/O
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

FCST_MTD_INPUT_DIR = {INPUT_BASE}/416_Fire
FCST_MTD_INPUT_TEMPLATE= {init?fmt=%Y%m%d%H}/wrfout_fire_d02_{valid?fmt=%Y-%m-%d_%H:%M:%S}

OBS_MTD_INPUT_DIR = {INPUT_BASE}/416_Fire
OBS_MTD_INPUT_TEMPLATE = {init?fmt=%Y%m%d%H}/wrfout_fire_d02_{valid?fmt=%Y-%m-%d_%H:%M:%S}

MTD_OUTPUT_DIR = {OUTPUT_BASE}/mtd/416_Fire
MTD_OUTPUT_PREFIX = {MODEL}_Fire_416


###
# Field Info
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#field-info
###

FCST_IS_PROB = False
FCST_PROB_IN_GRIB_PDS = false

FCST_VAR1_NAME = FIRE_AREA

FCST_MTD_CONV_RADIUS = 5
FCST_MTD_CONV_THRESH = >0.5


OBS_VAR1_NAME = FIRE_AREA

OBS_MTD_CONV_RADIUS = 5
OBS_MTD_CONV_THRESH = >0.5


###
# MTD Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#mtd
###

MTD_SINGLE_RUN = True
MTD_SINGLE_DATA_SRC = FCST

MODEL = WRF
MTD_DESC = NA
OBTYPE = WRF

MTD_CONFIG_FILE = {PARM_BASE}/met_config/MTDConfig_wrapped

#MTD_REGRID_TO_GRID =
#MTD_REGRID_METHOD =
#MTD_REGRID_WIDTH =
#MTD_REGRID_VLD_THRESH =
#MTD_REGRID_SHAPE =
#MTD_REGRID_CONVERT =
#MTD_REGRID_CENSOR_THRESH =
#MTD_REGRID_CENSOR_VAL =


#MTD_MIN_VOLUME = 2000

#MTD_TIME_OFFSET_WARNING =

[user_env_vars]
MET_USE_WRF_SUBGRID = yes
