###
# Processes to run
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#process-list
###

PROCESS_LIST = MODE


###
# Time Info
# LOOP_BY options are INIT, VALID, RETRO, and REALTIME
# If set to INIT or RETRO:
#   INIT_TIME_FMT, INIT_BEG, INIT_END, and INIT_INCREMENT must also be set
# If set to VALID or REALTIME:
#   VALID_TIME_FMT, VALID_BEG, VALID_END, and VALID_INCREMENT must also be set
# LEAD_SEQ is the list of forecast leads to process
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#timing-control
###

LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H%M
LEAD_SEQ = 0

# Bear Fire
VALID_BEG=202009082000
VALID_END=202009082045
VALID_INCREMENT = 900


MODE_MET_CONFIG_OVERRIDES = multivar_intensity_compare_fcst = []; multivar_intensity_compare_obs = [];

###
# File I/O
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

FCST_MODE_INPUT_DIR = {INPUT_BASE}
FCST_MODE_INPUT_TEMPLATE = PYTHON_NUMPY,PYTHON_NUMPY

OBS_MODE_INPUT_DIR = {FCST_MODE_INPUT_DIR}
OBS_MODE_INPUT_TEMPLATE = {FCST_MODE_INPUT_TEMPLATE}

FCST_MODE_FILE_WINDOW_BEGIN = 0
FCST_MODE_FILE_WINDOW_END = 0

OBS_MODE_FILE_WINDOW_BEGIN = 0
OBS_MODE_FILE_WINDOW_END = 0

###
# Field Info
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#field-info
###

FCST_IS_PROB = false

FCST_VAR1_NAME = /home/kalb/FireWx/read_wrfout_fire_rh_wind.py {FCST_MODE_INPUT_DIR}/BearFire_2020/BearFire_control_wrfout_d03_{valid?fmt=%Y-%m-%d_%H%M%S} RH
FCST_VAR1_OPTIONS = conv_radius = 3; conv_thresh = <= 15; merge_flag = THRESH; merge_thresh = <=20;
FCST_VAR2_NAME = /home/kalb/FireWx/read_wrfout_fire_rh_wind.py {FCST_MODE_INPUT_DIR}/BearFire_2020/BearFire_control_wrfout_d03_{valid?fmt=%Y-%m-%d_%H%M%S} WIND
FCST_VAR2_OPTIONS = conv_radius = 3; conv_thresh = >=11.176; merge_flag = THRESH; merge_thresh = >=9; 
MODE_OUTPUT_DIR = {OUTPUT_BASE}/mv_mode/Bear
MODE_OUTPUT_PREFIX = {MODEL}_Fire_Bear

MODE_MULTIVAR_LOGIC = #1 && #2
#MODE_MULTIVAR_INTENSITY_COMPARE_FCST =
#MODE_MULTIVAR_INTENSITY_COMPARE_OBS =

#MODE_FCST_FILE_TYPE =
MODE_FCST_FILTER_ATTR_NAME = AREA
MODE_FCST_FILTER_ATTR_THRESH = >=20
#MODE_FCST_FILTER_ATTR_THRESH = >=60
#MODE_FCST_CENSOR_THRESH =
#MODE_FCST_CENSOR_VAL =
#MODE_FCST_VLD_THRESH =


OBS_VAR1_NAME = {FCST_VAR1_NAME}
OBS_VAR1_LEVELS = {FCST_VAR1_LEVELS}
OBS_VAR1_OPTIONS = {FCST_VAR1_OPTIONS}
OBS_VAR2_NAME = {FCST_VAR2_NAME}
OBS_VAR2_LEVELS = {FCST_VAR2_LEVELS}
OBS_VAR2_OPTIONS = {FCST_VAR2_OPTIONS}


#MODE_OBS_FILE_TYPE =
MODE_OBS_FILTER_ATTR_NAME = {MODE_FCST_FILTER_ATTR_NAME}
MODE_OBS_FILTER_ATTR_THRESH = {MODE_FCST_FILTER_ATTR_THRESH}
