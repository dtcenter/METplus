[config]

# Documentation for this use case can be found at
# https://metplus.readthedocs.io/en/latest/generated/model_applications/land/GridStat_fcstGFS_obsSMOPS_soilMoisture_Python.html

# For additional information, please see the METplus Users Guide.
# https://metplus.readthedocs.io/en/latest/Users_Guide

###
# Processes to run
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#process-list
###

PROCESS_LIST = GridStat, SeriesAnalysis, GridDiag

###
# Time Info
# LOOP_BY options are INIT, VALID, RETRO, and REALTIME
# If set to INIT or RETRO:
#   INIT_TIME_FMT, INIT_BEG, INIT_END, and INIT_INCREMENT must also be set
# If set to VALID or REALTIME:
#   VALID_TIME_FMT, VALID_BEG, VALID_END, and VALID_INCREMENT must also be set
# LEAD_SEQ is the list of forecast leads to process
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#timing-control
###

LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG=2020060700
INIT_END=2020060700
INIT_INCREMENT = 12H

LEAD_SEQ = 24


###
# File I/O
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

# Input data sources
GFS_INPUT_TEMPLATE = {init?fmt=%Y%m%d%H}.f{lead?fmt=%3H}.grib2
SMOPS_INPUT_TEMPLATE = NPR_SMOPS_CMAP_D{valid?fmt=%Y%m%d}.nc
SMOPS_SM_NAME = {PARM_BASE}/use_cases/model_applications/land/GridStat_fcstGFS_obsSMOPS_soilMoisture_Python/read_SMOPS_data.py {INPUT_BASE}/model_applications/land/GridStat_fcstGFS_obsSMOPS_soilMoisture_Python/NPR_SMOPS_CMAP_D20200608.nc Blended_SM
SMOPS_SM_LEVELS = "(*,*)"
GLEAM_SH_INPUT_TEMPLATE = H_{valid?fmt=%Y%m%d}_GLEAM_v4.3a.nc
GLEAM_LH_INPUT_TEMPLATE = E_{valid?fmt=%Y%m%d}_GLEAM_v4.3a.nc

FCST_GRID_STAT_INPUT_DIR = {INPUT_BASE}/model_applications/land/GridStat_fcstGFS_obsSMOPS_soilMoisture_Python
FCST_GRID_STAT_INPUT_TEMPLATE = {GFS_INPUT_TEMPLATE}

OBS_GRID_STAT_INPUT_DIR = 
OBS_GRID_STAT_INPUT_TEMPLATE = PYTHON_NUMPY

GRID_STAT_CLIMO_MEAN_INPUT_DIR =
GRID_STAT_CLIMO_MEAN_INPUT_TEMPLATE =

GRID_STAT_CLIMO_STDEV_INPUT_DIR =
GRID_STAT_CLIMO_STDEV_INPUT_TEMPLATE =

GRID_STAT_OUTPUT_DIR = {OUTPUT_BASE}/GridStat_fcstGFS_obsSMOPS_soilMoisture_Python/GridStat


###
# Field Info
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#field-info
###

MODEL = WRF
OBTYPE = SMOPS

GRID_STAT_ONCE_PER_FIELD = False

FCST_IS_PROB = false

FCST_VAR1_NAME = SOILW
FCST_VAR1_LEVELS = Z0-0.1

OBS_VAR1_NAME = {SMOPS_SM_NAME}
OBS_VAR1_LEVELS = {SMOPS_SM_LEVELS}

GRID_STAT_CONFIG_FILE = {PARM_BASE}/met_config/GridStatConfig_wrapped

GRID_STAT_REGRID_TO_GRID = OBS
GRID_STAT_REGRID_METHOD = BILIN
GRID_STAT_REGRID_WIDTH = 2
GRID_STAT_DESC = NA


GRID_STAT_OUTPUT_FLAG_CNT = STAT

GRID_STAT_NC_PAIRS_FLAG_LATLON = TRUE
GRID_STAT_NC_PAIRS_FLAG_RAW = TRUE
GRID_STAT_NC_PAIRS_FLAG_DIFF = TRUE
GRID_STAT_NC_PAIRS_FLAG_CLIMO = FALSE
GRID_STAT_NC_PAIRS_FLAG_APPLY_MASK = TRUE


GRID_STAT_MASK_POLY = MET_BASE/poly/CONUS.poly


SERIES_ANALYSIS_RUNTIME_FREQ = RUN_ONCE_PER_INIT_OR_VALID
SERIES_ANALYSIS_RUN_ONCE_PER_STORM_ID = False
FCST_SERIES_ANALYSIS_INPUT_DIR = {FCST_GRID_STAT_INPUT_DIR}
FCST_SERIES_ANALYSIS_INPUT_TEMPLATE = {FCST_GRID_STAT_INPUT_TEMPLATE}

OBS_SERIES_ANALYSIS_INPUT_DIR = {FCST_GRID_STAT_INPUT_DIR}
OBS_SERIES_ANALYSIS_INPUT_TEMPLATE = NPR_SMOPS_CMAP_D{valid?fmt=%Y%m%d}.nc 
OBS_SERIES_ANALYSIS_INPUT_DATATYPE = PYTHON_NUMPY

SERIES_ANALYSIS_OUTPUT_DIR = {OUTPUT_BASE}/GridStat_fcstGFS_obsSMOPS_soilMoisture_Python/SeriesAnalysis
SERIES_ANALYSIS_OUTPUT_TEMPLATE = series_analysis_init_{init?fmt=%Y%m%d%H}_cnt_output.nc

SERIES_ANALYSIS_REGRID_TO_GRID = OBS
SERIES_ANALYSIS_REGRID_METHOD = BILIN
SERIES_ANALYSIS_REGRID_WIDTH = 2

SERIES_ANALYSIS_OUTPUT_STATS_CNT = ME, MAE, RMSE, MBIAS, FBAR, OBAR

SERIES_ANALYSIS_MASK_POLY = MET_BASE/poly/CONUS.poly
SERIES_ANALYSIS_BLOCK_SIZE = 0

###
# GridDiag Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#griddiag
###

GRID_DIAG_RUNTIME_FREQ = RUN_ONCE_PER_INIT_OR_VALID

# Pass the same forecast data used by GridStat/SeriesAnalysis and the same
# observation data used by SeriesAnalysis as two separate -data arguments
GRID_DIAG_INPUT_DIR = {FCST_GRID_STAT_INPUT_DIR}
GRID_DIAG_INPUT_TEMPLATE = {GFS_INPUT_TEMPLATE}, {GFS_INPUT_TEMPLATE},
                           {GFS_INPUT_TEMPLATE}, {SMOPS_INPUT_TEMPLATE},
                           {GLEAM_SH_INPUT_TEMPLATE}, {GLEAM_LH_INPUT_TEMPLATE}

GRID_DIAG_OUTPUT_DIR = {OUTPUT_BASE}/GridStat_fcstGFS_obsSMOPS_soilMoisture_Python/GridDiag
GRID_DIAG_OUTPUT_TEMPLATE = grid_diag_init_{init?fmt=%Y%m%d%H}_output.nc

# Global 0.25 degree Lat/Lon grid:
#   https://www.nco.ncep.noaa.gov/pmb/docs/on388/tableb.html#GRID193
GRID_DIAG_REGRID_TO_GRID = G193
GRID_DIAG_REGRID_METHOD = BILIN
GRID_DIAG_REGRID_WIDTH = 2

GRID_DIAG_DESC = NA

GRID_DIAG_CONFIG_FILE = {PARM_BASE}/met_config/GridDiagConfig_wrapped

# Intercompare GFS soil moisture, latent heat flux, and sensible heat flux with
# SMOPS soil moisture, GLEAM latent heat flux, and GLEAN sensible heat flux

FCST_GRID_DIAG_VAR1_NAME = SOILW
FCST_GRID_DIAG_VAR1_LEVELS = Z0-0.1
FCST_GRID_DIAG_VAR1_OPTIONS = set_attr_name = "GFS_SM"; set_attr_level = "SFC";
                              n_bins = 100; range = [0.0, 1.0];

FCST_GRID_DIAG_VAR2_NAME = SHTFL
FCST_GRID_DIAG_VAR2_LEVELS = A0
FCST_GRID_DIAG_VAR2_OPTIONS = set_attr_name = "GFS_SH"; set_attr_level = "SFC";
                              n_bins = 140; range = [-200.0, 500.0];

FCST_GRID_DIAG_VAR3_NAME = LHTFL
FCST_GRID_DIAG_VAR3_LEVELS = A0
FCST_GRID_DIAG_VAR3_OPTIONS = set_attr_name = "GFS_LH"; set_attr_level = "SFC";
                              n_bins = 140; range = [-200.0, 500.0];

FCST_GRID_DIAG_VAR4_NAME = {SMOPS_SM_NAME}
FCST_GRID_DIAG_VAR4_LEVELS = {SMOPS_SM_LEVELS}
FCST_GRID_DIAG_VAR4_OPTIONS = file_type = PYTHON_NUMPY;
                              set_attr_name = "SMOPS_SM"; set_attr_level = "SFC";
                              n_bins = 100; range = [0.0, 1.0];

FCST_GRID_DIAG_VAR5_NAME = H
FCST_GRID_DIAG_VAR5_LEVELS = "({valid?fmt=%Y%m%d},*,*)"
FCST_GRID_DIAG_VAR5_OPTIONS = file_type = NETCDF_NCCF;
                              set_attr_name = "GLEAM_SH"; set_attr_level = "SFC";
                              n_bins = 100; range = [-200.0, 300.0];

FCST_GRID_DIAG_VAR6_NAME = E
FCST_GRID_DIAG_VAR6_LEVELS = "({valid?fmt=%Y%m%d},*,*)"
FCST_GRID_DIAG_VAR6_OPTIONS = file_type = NETCDF_NCCF;
                              set_attr_name = "GLEAM_LH"; set_attr_level = "SFC";
                              n_bins = 100; range = [0.0, 10.0];

GRID_DIAG_MASK_POLY = MET_BASE/poly/CONUS.poly

GRID_DIAG_OUTPUT_FLAG_HISTOGRAM_1D = TRUE
GRID_DIAG_OUTPUT_FLAG_HISTOGRAM_2D = TRUE
GRID_DIAG_OUTPUT_FLAG_INFO_THEORY = TRUE
