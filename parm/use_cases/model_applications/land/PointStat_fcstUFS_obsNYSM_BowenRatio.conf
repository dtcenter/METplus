[config]

###
# Processes to run
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#process-list
###

#PROCESS_LIST = ASCII2NC, PointStat(gen), GenVxMask, PointStat(flux), PointStat(bowen)
PROCESS_LIST = ASCII2NC, GenVxMask, PointStat(flux)
POINT_STAT_CUSTOM_LOOP_LIST = hr1.sub, hr2.sub

###
# Time Info
# LOOP_BY options are INIT, VALID, RETRO, and REALTIME
# If set to INIT or RETRO:
#   INIT_TIME_FMT, INIT_BEG, INIT_END, and INIT_INCREMENT must also be set
# If set to VALID or REALTIME:
#   VALID_TIME_FMT, VALID_BEG, VALID_END, and VALID_INCREMENT must also be set
# LEAD_SEQ is the list of forecast leads to process
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#timing-control
###

LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG = 2020060100
INIT_END = 2020060700
#INIT_END = {INIT_BEG}
INIT_INCREMENT = 72H
#LEAD_SEQ = 24, 48, 72, 96, 120
LEAD_SEQ = 18, 24, 42, 48, 66, 72, 90, 96, 114, 120, 138

# Set a config item for the use case directory
METPLUS_USECASE_SUBDIR = model_applications/land/PointStat_fcstUFS_obsNYSM_BowenRatio
METPLUS_USECASE_DIR = {PARM_BASE}/use_cases/{METPLUS_USECASE_SUBDIR}

# Set the minimum latent heat flux value (w * m^2) for computing Bowen ratio
OBS_MIN_LATENT_HEAT_FLUX = 1e-6
FCST_MIN_LATENT_HEAT_FLUX = 1e-6

###
# File I/O - ASCII2NC
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

# Observation averaging interval used with Pandas .resample() in Python embedding with ASCII2NC
ASCII2NC_WINDOW_AROUND_VALID_SECONDS = 3600

ASCII2NC_INPUT_DIR = {METPLUS_USECASE_DIR}
ASCII2NC_INPUT_TEMPLATE = read_nysm.py {valid?fmt=%Y%m%d%H} {METPLUS_USECASE_DIR} {INPUT_BASE}/{METPLUS_USECASE_SUBDIR}/obs {OBS_MIN_LATENT_HEAT_FLUX} {ASCII2NC_WINDOW_AROUND_VALID_SECONDS}

ASCII2NC_OUTPUT_DIR = {OUTPUT_BASE}/ascii2nc
ASCII2NC_OUTPUT_TEMPLATE = nysm_data_{valid?fmt=%Y%m%d%H}.nc

###
# ASCII2NC Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#ascii2nc
###

LOG_ASCII2NC_VERBOSITY = 4

ASCII2NC_INPUT_FORMAT = python

ASCII2NC_SKIP_IF_OUTPUT_EXISTS = True

###
# GenVxMask Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#genvxmask
###

GEN_VX_MASK_INPUT_DIR = {METPLUS_USECASE_DIR}
GEN_VX_MASK_INPUT_TEMPLATE = ny_mask.nc

GEN_VX_MASK_INPUT_MASK_DIR = {INPUT_BASE}/{METPLUS_USECASE_SUBDIR}/fcst/hr1.sub
GEN_VX_MASK_INPUT_MASK_TEMPLATE = {init?fmt=%Y%m%d%H}/{init?fmt=%Y%m%d%H}.f{lead?fmt=%HHH}.grib2

GEN_VX_MASK_OUTPUT_DIR = {OUTPUT_BASE}/masks
GEN_VX_MASK_OUTPUT_TEMPLATE = {init?fmt=%Y%m%d%H}.f{lead?fmt=%HHH}_ny_solar_time.nc

GEN_VX_MASK_OPTIONS = -type solar_time -thresh 'ge9.0&&le19.0' -intersection -mask_field 'name="TMP"; level="L0";'

LOG_GEN_VX_MASK_VERBOSITY = 10

###
# Common PointStat Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#pointstat
###

MODEL={custom}

LOG_POINT_STAT_VERBOSITY = 4

POINT_STAT_CONFIG_FILE ={PARM_BASE}/met_config/PointStatConfig_wrapped

POINT_STAT_OUTPUT_FLAG_CNT = STAT
POINT_STAT_OUTPUT_FLAG_SL1L2 = STAT
POINT_STAT_OUTPUT_FLAG_MPR = BOTH

OBS_POINT_STAT_WINDOW_BEGIN = -5400
OBS_POINT_STAT_WINDOW_END = 5400

POINT_STAT_DESC = NYSM
OBTYPE = NYSM

POINT_STAT_MESSAGE_TYPE = ADPSFC

POINT_STAT_OUTPUT_DIR = {OUTPUT_BASE}/point_stat/{instance}_{MODEL}

POINT_STAT_OBS_QUALITY_INC = 11,12,13,14,15,16,NA

###
# File I/O - POINT_STAT
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

FCST_POINT_STAT_INPUT_DIR = {INPUT_BASE}/{METPLUS_USECASE_SUBDIR}/fcst/{MODEL}
FCST_POINT_STAT_INPUT_TEMPLATE = {init?fmt=%Y%m%d%H}/{init?fmt=%Y%m%d%H}.f{lead?fmt=%HHH}.grib2

OBS_POINT_STAT_INPUT_DIR = {ASCII2NC_OUTPUT_DIR}
OBS_POINT_STAT_INPUT_TEMPLATE = {ASCII2NC_OUTPUT_TEMPLATE}

# Point Stat for general forecast variables (except flux and Bowen ratio)
[gen]

###
# Field Info
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#field-info
###

# For general fields we don't need to mask solar time
POINT_STAT_MASK_POLY = {METPLUS_USECASE_DIR}/ny_mask.nc

FCST_VAR1_NAME = TMP
FCST_VAR1_LEVELS = Z2
FCST_VAR1_OPTIONS = convert(x) = K_to_C(x)
OBS_VAR1_NAME = TMP
OBS_VAR1_LEVELS = Z2

BOTH_VAR2_NAME = WIND
BOTH_VAR2_LEVELS = Z10

BOTH_VAR3_NAME = SNOD
BOTH_VAR3_LEVELS = L0

BOTH_VAR4_NAME = TSOIL
BOTH_VAR4_LEVELS = Z0-0.1, Z0.1-0.4, Z0.4-1
FCST_VAR4_OPTIONS = convert(x) = K_to_C(x); message_type = "TSOILDEPTH"
OBS_VAR4_OPTIONS = message_type = "TSOILDEPTH"

BOTH_VAR5_NAME = SOILW
BOTH_VAR5_LEVELS = Z0-0.1, Z0.1-0.4, Z0.4-1
BOTH_VAR5_OPTIONS = message_type = "SOILWDEPTH"

# Point Stat for flux variables (except Bowen ratio)
[flux]

# For flux fields, we incorporate solar time with the NY spatial mask
POINT_STAT_MASK_POLY = {OUTPUT_BASE}/masks/{init?fmt=%Y%m%d%H}.f{lead?fmt=%HHH}_ny_solar_time.nc

BOTH_VAR1_NAME = LHTFL
BOTH_VAR1_LEVELS = L0
FCST_VAR1_OPTIONS = GRIB2_pdt = 0

BOTH_VAR2_NAME = SHTFL
BOTH_VAR2_LEVELS = L0
FCST_VAR2_OPTIONS = GRIB2_pdt = 0

BOTH_VAR3_NAME = FRICV
BOTH_VAR3_LEVELS = L0
FCST_VAR3_OPTIONS = GRIB2_pdt = 0

BOTH_VAR4_NAME = GFLUX
BOTH_VAR4_LEVELS = L0
FCST_VAR4_OPTIONS = GRIB2_pdt = 0

# Point Stat for Bowen ratio
[bowen]

# Use solar time for Bowen ratio as well
POINT_STAT_MASK_POLY = {OUTPUT_BASE}/masks/{init?fmt=%Y%m%d%H}.f{lead?fmt=%HHH}_ny_solar_time.nc

FCST_POINT_STAT_INPUT_DIR =
FCST_POINT_STAT_INPUT_TEMPLATE = PYTHON_NUMPY

OBS_POINT_STAT_INPUT_DIR = {ASCII2NC_OUTPUT_DIR}
OBS_POINT_STAT_INPUT_TEMPLATE = {ASCII2NC_OUTPUT_TEMPLATE}

###
# Field Info
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#field-info
###
#
GRIB_LHTFL_SHORTNAME = slhtf
GRIB_SHTFL_SHORTNAME = ishf
FCST_VAR1_NAME = {METPLUS_USECASE_DIR}/read_bowen_fcst.py {valid?fmt=%Y%m%d%H} {lead?fmt=%HHH} {INPUT_BASE}/{METPLUS_USECASE_SUBDIR}/fcst/{MODEL} {OUTPUT_BASE}/point_stat/{instance}_{MODEL} {GRIB_SHTFL_SHORTNAME} {GRIB_LHTFL_SHORTNAME} {FCST_MIN_LATENT_HEAT_FLUX}
FCST_VAR1_LEVELS = L0
OBS_VAR1_NAME = BOWEN
OBS_VAR1_LEVELS = L0

