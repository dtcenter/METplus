[config]

###
# Processes to run
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#process-list
###

#PROCESS_LIST = ASCII2NC, PointStat(gen), PointStat(bowen)
PROCESS_LIST = ASCII2NC, PointStat(gen_hr1), PointStat(bowen_hr1), PointStat(gen_hr2), PointStat(bowen_hr2)

###
# Time Info
# LOOP_BY options are INIT, VALID, RETRO, and REALTIME
# If set to INIT or RETRO:
#   INIT_TIME_FMT, INIT_BEG, INIT_END, and INIT_INCREMENT must also be set
# If set to VALID or REALTIME:
#   VALID_TIME_FMT, VALID_BEG, VALID_END, and VALID_INCREMENT must also be set
# LEAD_SEQ is the list of forecast leads to process
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#timing-control
###

LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H
VALID_BEG = 2020080300
VALID_END = 2020080300
VALID_INCREMENT = 24H

#LEAD_SEQ = begin_end_incr(0,384,3)
#LEAD_SEQ = 0, 24, 48, 72, 96, 120, 144, 168, 192, 216, 240, 264, 288, 312, 336, 360, 384
LEAD_SEQ = 72

# Set a config item for the use case directory
METPLUS_USECASE_SUBDIR = model_applications/land/PointStat_fcstUFS_obsNYSM_BowenRatio
METPLUS_USECASE_DIR = {PARM_BASE}/use_cases/{METPLUS_USECASE_SUBDIR}

###
# File I/O
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

ASCII2NC_INPUT_DIR = {METPLUS_USECASE_DIR}
ASCII2NC_INPUT_TEMPLATE = read_nysm.py {VALID_BEG} {VALID_END} {METPLUS_USECASE_DIR} {INPUT_BASE}/{METPLUS_USECASE_SUBDIR}/obs

ASCII2NC_OUTPUT_DIR = {OUTPUT_BASE}/ascii2nc
ASCII2NC_OUTPUT_TEMPLATE = nysm_data_{VALID_BEG}-{VALID_END}.nc

ASCII2NC_SKIP_IF_OUTPUT_EXISTS = True

ASCII2NC_FILE_WINDOW_BEGIN = 0
ASCII2NC_FILE_WINDOW_END = 0


###
# ASCII2NC Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#ascii2nc
###

LOG_ASCII2NC_VERBOSITY = 4
#ASCII2NC_CONFIG_FILE =

ASCII2NC_WINDOW_BEGIN = 0
ASCII2NC_WINDOW_END = 0

ASCII2NC_INPUT_FORMAT = python

ASCII2NC_MASK_GRID =
ASCII2NC_MASK_POLY =
ASCII2NC_MASK_SID =

ASCII2NC_TIME_SUMMARY_FLAG = False
ASCII2NC_TIME_SUMMARY_RAW_DATA = False
ASCII2NC_TIME_SUMMARY_BEG = 000000
ASCII2NC_TIME_SUMMARY_END = 235959
ASCII2NC_TIME_SUMMARY_STEP = 300
ASCII2NC_TIME_SUMMARY_WIDTH = 600
ASCII2NC_TIME_SUMMARY_GRIB_CODES = 11, 204, 211
ASCII2NC_TIME_SUMMARY_VAR_NAMES =
ASCII2NC_TIME_SUMMARY_TYPES = min, max, range, mean, stdev, median, p80
ASCII2NC_TIME_SUMMARY_VALID_FREQ = 0
ASCII2NC_TIME_SUMMARY_VALID_THRESH = 0.0

###
# Common PointStat Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#pointstat
###

LOG_POINT_STAT_VERBOSITY = 4

POINT_STAT_CONFIG_FILE ={PARM_BASE}/met_config/PointStatConfig_wrapped

POINT_STAT_OUTPUT_FLAG_CNT = STAT
POINT_STAT_OUTPUT_FLAG_SL1L2 = STAT

OBS_POINT_STAT_WINDOW_BEGIN = -5400
OBS_POINT_STAT_WINDOW_END = 5400

POINT_STAT_OFFSETS = 0

POINT_STAT_DESC = NYSM
OBTYPE = NYSM

POINT_STAT_REGRID_TO_GRID = NONE
POINT_STAT_REGRID_METHOD = BILIN
POINT_STAT_REGRID_WIDTH = 2

POINT_STAT_OUTPUT_PREFIX =

POINT_STAT_MASK_GRID = 
POINT_STAT_MASK_POLY = /glade/work/briannen/metplus_land/workflow/ne_shapefiles/ny_mask.nc
POINT_STAT_MASK_SID =

POINT_STAT_MESSAGE_TYPE = ADPSFC

# Point Stat for general forecast variables (except Bowen ratio)
[gen_hr1]

###
# File I/O
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

MODEL=hr1.sub

FCST_POINT_STAT_INPUT_DIR = {INPUT_BASE}/{MODEL}
FCST_POINT_STAT_INPUT_TEMPLATE = {init?fmt=%Y%m%d%H}/{init?fmt=%Y%m%d%H}.f{lead?fmt=%HHH}.grib2

OBS_POINT_STAT_INPUT_DIR = {ASCII2NC_OUTPUT_DIR}
OBS_POINT_STAT_INPUT_TEMPLATE = {ASCII2NC_OUTPUT_TEMPLATE}

POINT_STAT_OUTPUT_DIR = {OUTPUT_BASE}/point_stat/{MODEL}/gen_hr1

###
# Field Info
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#field-info
###

FCST_VAR1_NAME = TMP
FCST_VAR1_LEVELS = Z2
FCST_VAR1_OPTIONS = convert(x) = K_to_C(x)
OBS_VAR1_NAME = TMP
OBS_VAR1_LEVELS = Z2

BOTH_VAR2_NAME = RH
BOTH_VAR2_LEVELS = Z2

BOTH_VAR3_NAME = WIND
BOTH_VAR3_LEVELS = Z10

BOTH_VAR4_NAME = SNOD
BOTH_VAR4_LEVELS = L0

BOTH_VAR5_NAME = TSOIL
BOTH_VAR5_LEVELS = R5, R7, R9

BOTH_VAR6_NAME = SOILW
BOTH_VAR6_LEVELS = R6, R8, R10

BOTH_VAR7_NAME = LHTFL
BOTH_VAR7_LEVELS = R32

BOTH_VAR8_NAME = SHTFL
BOTH_VAR8_LEVELS = R33

BOTH_VAR9_NAME = FRICV
BOTH_VAR9_LEVELS = R35

BOTH_VAR10_NAME = GFLUX
BOTH_VAR10_LEVELS = R34

# Point Stat for Bowen ratio
[bowen_hr1]

MODEL=hr1.sub

FCST_POINT_STAT_INPUT_DIR =
FCST_POINT_STAT_INPUT_TEMPLATE = PYTHON_NUMPY

OBS_POINT_STAT_INPUT_DIR = {ASCII2NC_OUTPUT_DIR}
OBS_POINT_STAT_INPUT_TEMPLATE = {ASCII2NC_OUTPUT_TEMPLATE}

POINT_STAT_OUTPUT_DIR = {OUTPUT_BASE}/point_stat/{MODEL}/bowen_hr1

###
# Field Info
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#field-info
###
#
FCST_VAR1_NAME = read_bowen_fcst.py {valid?fmt=%Y%m%d%H} {lead?fmt=%HHH} {INPUT_BASE}/{MODEL}
FCST_VAR1_LEVELS = L0
OBS_VAR1_NAME = BOWEN
OBS_VAR1_LEVELS = L0

