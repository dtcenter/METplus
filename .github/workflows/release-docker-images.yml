name: Create Release Docker Images

on:

  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      release_version:
        description: 'Comma-separated list of versions to build, e.g. v6.0,v6.1'
        default: 'v6.0,v6.1'
        required: true
        type: string
      update_latest:
        description: 'Update "X.Y-latest" images.'
        default: false
        required: true
        type: boolean

  schedule:
    - cron: "30 06 * * 0"

jobs:

  define-matrix:
    name: Define Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-versions.outputs.matrix }}
      update_latest: ${{ steps.get-versions.outputs.update_latest }}

    steps:

      - uses: actions/checkout@v4
        with:
          repository: 'dtcenter/metplus'
          ref: 'develop'
          sparse-checkout: metplus/component_versions.py
          sparse-checkout-cone-mode: false

      - name: Get versions to build 
        id: get-versions
        run: |
          if [[ ${{ github.event_name }} == 'schedule' ]]; then
            version_string="v6.0,v6.1"
            update_latest="true"
          elif [[ ${{ github.event_name }} == 'workflow_dispatch' ]]; then
            version_string=${{ toJSON(inputs.release_version) }}
            update_latest=${{ toJSON(inputs.update_latest) }}
          else
            version_string=${{ toJSON(github.ref_name) }}
            update_latest="true"
          fi
          IFS=',' read -r -a version_array <<< "${version_string}"
          matrix="{\"version\": ["
          for version in "${version_array[@]}"; do
            if [[ ${version} =~ ^v[0-9]+.[0-9]+$ ]]; then
              matrix+=\"$(${GITHUB_WORKSPACE}/metplus/component_versions.py -v ${version} -i METplus -o METplus)\",
            else
              matrix+=\"${version}\",
            fi
          done
          matrix+="]}"
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          echo "update_latest=${update_latest}" >> $GITHUB_OUTPUT
 
  build_scan_and_push:
    name: Build, Scan, and Push Images
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy:
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version }}
          path: ${{ matrix.version }}
          sparse-checkout: internal/scripts/docker
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v4
        with:
          ref: 'develop'
          path: 'develop'
          sparse-checkout: metplus/component_versions.py
          sparse-checkout-cone-mode: false

      - name: Create directories to store output
        run: |
          mkdir -p ${RUNNER_WORKSPACE}/logs

      - name: Build Docker Images
        id: build_images
        run: .github/jobs/docker_build_metplus_images.sh
        env:
          SOURCE_BRANCH: ${{ matrix.version }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Docker Images
        run: |
          .github/jobs/docker_scan_metplus_images.sh
        env:
          SOURCE_BRANCH: ${{ matrix.version }}

      - name: Push Docker Images
        run: |
          .github/jobs/docker_push_metplus_images.sh
        env:
          SOURCE_BRANCH: ${{ matrix.version }}
          UPDATE_LATEST: ${{ fromJSON(needs.define-matrix.outputs.update_latest) }}
          DOCKER_USERNAME: 'dtcenter'
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}

      - name: Copy log files into logs directory
        if: always()
        run: |
          cp ${GITHUB_WORKSPACE}/*.log ${RUNNER_WORKSPACE}/logs/

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs_${{ matrix.version }}
          path: ${{ runner.workspace }}/logs
          if-no-files-found: ignore
