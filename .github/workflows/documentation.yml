name: Documentation
on:
  push:
    branches:
      - develop
      - feature_**
      - main_**
      - bugfix_**
    paths:
      - docs/**
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade python-dateutil requests Pillow
          python -m pip install -r docs/requirements.txt
      - name: Build Documentation
        run: ./.github/jobs/build_documentation.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: METplus_documentation
          path: artifact/documentation
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: documentation_warnings.log
          path: artifact/doc_warnings.log
          if-no-files-found: ignore
      - name: Check links
        uses: dtcenter/metplus-action-linkcheck@v1
        with:
          fail-on-broken-links: 'true'
          upload-artifact: 'true'
          install-package: 'true'
          rtd-url: 'https://metplus.readthedocs.io/en/{version}/'
